<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/fevicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="CineVerse - Discover, search, and track your favorite movies, TV shows, and anime. Powered by TMDB API." />
    <meta name="keywords" content="movies, tv shows, anime, streaming, movie explorer, tmdb, trailer, reviews" />
    <meta name="author" content="Abhishek Kalme" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineVerse" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cineverse25.netlify.app/" />
    <meta property="og:title" content="CineVerse - Discover Movies & Shows" />
    <meta property="og:description" content="Discover and track your favorite content with a premium cinematic experience." />
    <meta property="og:image" content="/fevicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cineverse25.netlify.app/" />
    <meta property="twitter:title" content="CineVerse - Discover Movies & Shows" />
    <meta property="twitter:description" content="Discover and track your favorite content with a premium cinematic experience." />
    <meta property="twitter:image" content="/fevicon.png" />

    <title>CineVerse | Discover Movies & Shows</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('SW registered:', reg.scope))
            .catch((err) => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
